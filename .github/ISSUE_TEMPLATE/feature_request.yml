name: Feature request
description: Propose an evidence-backed improvement
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer or agent problem does this solve?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success evidence
      description: How should deterministic tests or evidence demonstrate the change?
    validations:
      required: true
