name: Bug report
description: Report a reproducible ProductionOS problem
title: "bug: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, fixture/repository shape, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include Node version, ProductionOS version, and relevant JSON evidence without secrets.
    validations:
      required: true
